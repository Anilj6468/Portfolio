<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Anil Jangid Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="CSS3/style.CSS">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">


<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
/* ===== Edit your content here ===== */
const PROFILE = {
  first: "Anil", last: "Jangid",
  role: "Front-end Developer",
  intro: "I design interfaces and then build them in React, so nothing gets lost between the HTML file and the browser.",
  city: "Ahemdabad, India", timeZone: "Asia/Kolkata",
  experienceYears: "Freshers", focus: "HTML, CSS, JavaScript, React, Tailwind CSS, Bootstrap, Media Queries, Responsive Design, Git, GitHub, VS Code, Chrome DevTools",
  email: "anilj3517@gmail.com",
  socials: [
    ["GitHub", "https://github.com/Anilj6468"], ["LinkedIn", "https://www.linkedin.com/in/anil-jangid-849509230/?isSelfProfile=true"]
  ]
};

const PROJECTS = [
  { id:"orbit", title:"Orbit Talks", client:"Orbit Conference", year:2023, tags:["Brand","Web"],
    thumb:{v:"orbit", bg:"#6D28D9", fg:"#E9DDFF", ac:"#FF8AD8"},
    summary:"Event identity and schedule app for a 2,000-person tech conference.",
    problem:"Attendees missed talks because the schedule was a PDF.",
    approach:"Built a schedule app with personal agendas, room maps and push reminders, plus a generative identity system for 48 speaker cards.",
    results:[["2,000","attendees"],["72%","built a personal agenda"],["48","generated speaker cards"]],
    role:"Brand & web lead", team:"2 designers", time:"8 weeks", stack:["React","Canvas","Netlify"] }
];

const EXPERIENCE = [
  { years:"2025 — Present Part Time", title:"Wordpress Composser and Social Media", Company:"ArchiDiaries", Location:"Ahmedabad"},
  { years:"2024 — 2025", title:"Data Entry Operator", Company:"Intesols Private Limited", Location:"Ahmedabad" },
  { years:"2021 — 2024", title:"Wordpress Composser and Social Media", Company: "ArchiDiaries", Location:"Ahmedabad"},
];

const SKILLS = {
  Build:["HTML","CSS","JavaScript","React","Tailwind CSS","Bootstrap", "Media Queries","Responsive Design"],
  Tools:["Git","GitHub","VS Code","Chrome DevTools"],
};

const QUOTES = [
  { q:"Anil shipped the design and the code in the time it usually takes us to agree on a mockup.", who:"Riya Kapoor", role:"Co-founder, Ledgerly" },
  { q:"Our nurses stopped asking where things were. That is the best review a design system can get.", who:"Dr. Sameer Joshi", role:"CMIO, Pulse Health" },
  { q:"He treats a booking form with the same care as a brand identity. Our studio feels like itself online.", who:"Meera Iyer", role:"Founder, Kiln Studio" }
];
/* ===== End of content ===== */

const { useState, useEffect, useRef, useMemo, useCallback } = React;
const html = htm.bind(React.createElement);

function Thumb({ t, seed = 1 }) {
  const { v, bg, fg, ac } = t;
  let art = null;
  if (v === "bars") {
    const h = [120,180,90,210,150,240,170,200,130,260];
    art = h.map((x,i)=>html`<rect key=${i} x=${30+i*36} y=${280-x} width="24" height=${x} rx="3" fill=${i===7?ac:fg} opacity=${i===7?1:.85}/>`);
  } else if (v === "wave") {
    art = Array.from({length:9},(_,k)=>{
      let d = "M0 " + (60+k*26);
      for (let x=0;x<=400;x+=10) d += ` L${x} ${(60+k*26 + Math.sin((x/40)+k*.7)*(10+k*2)).toFixed(1)}`;
      return html`<path key=${k} d=${d} fill="none" stroke=${k===4?ac:fg} stroke-width=${k===4?3:1.5} opacity=${k===4?1:.7}/>`;
    });
  } else if (v === "rings") {
    art = [html`<circle key="b" cx="260" cy="170" r="70" fill=${ac}/>`, ...Array.from({length:7},(_,k)=>html`<circle key=${k} cx="160" cy="150" r=${20+k*22} fill="none" stroke=${fg} stroke-width="2"/>`)];
  } else if (v === "grid") {
    const out=[];
    for(let r=0;r<10;r++)for(let c=0;c<14;c++){const on=(r*7+c*3)%11===0||(r===5&&c>3&&c<10);out.push(html`<circle key=${r+"-"+c} cx=${30+c*26} cy=${33+r*26} r=${on?6:3} fill=${on?ac:fg}/>`)}
    art=out;
  } else if (v === "blocks") {
    art = html`<g>
      <rect x="130" y="30" width="140" height="250" rx="22" fill=${fg}/>
      <rect x="142" y="58" width="116" height="60" rx="10" fill=${ac}/>
      <rect x="142" y="128" width="54" height="54" rx="10" fill=${bg}/>
      <rect x="204" y="128" width="54" height="54" rx="10" fill=${ac} opacity=".6"/>
      <rect x="142" y="192" width="116" height="12" rx="6" fill=${ac} opacity=".5"/>
      <rect x="142" y="212" width="80" height="12" rx="6" fill=${ac} opacity=".3"/>
      <rect x="142" y="240" width="116" height="26" rx="13" fill=${bg}/>
    </g>`;
  } else if (v === "orbit") {
    art = html`<g>
      <ellipse cx="200" cy="150" rx="160" ry="56" fill="none" stroke=${fg} stroke-width="1.5" transform="rotate(-18 200 150)"/>
      <ellipse cx="200" cy="150" rx="110" ry="110" fill="none" stroke=${fg} stroke-width="1.5" opacity=".5"/>
      <circle cx="200" cy="150" r="44" fill=${ac}/>
      <circle cx="345" cy="104" r="10" fill=${fg}/>
      <circle cx="96" cy="232" r="6" fill=${fg}/>
    </g>`;
  }
  return html`<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="400" height="300" fill=${bg}/>${art}</svg>`;
}

function useClock(tz) {
  const fmt = useMemo(()=>new Intl.DateTimeFormat("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:tz}),[tz]);
  const [now,setNow] = useState(()=>fmt.format(new Date()));
  useEffect(()=>{ const id=setInterval(()=>setNow(fmt.format(new Date())),15000); return ()=>clearInterval(id); },[fmt]);
  return now;
}

function ThemeToggle() {
  const sysDark = () => window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  const [theme,setTheme] = useState(()=>{
    let saved=null; try{ saved=localStorage.getItem("pf-theme"); }catch(e){}
    return saved || document.documentElement.getAttribute("data-theme") || (sysDark()?"dark":"light");
  });
  useEffect(()=>{ document.documentElement.setAttribute("data-theme",theme); try{ localStorage.setItem("pf-theme",theme); }catch(e){} },[theme]);
  const dark = theme==="dark";
  return html`<button class="icon-btn" onClick=${()=>setTheme(dark?"light":"dark")} aria-label=${dark?"Switch to light theme":"Switch to dark theme"}>
    ${dark
      ? html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`
      : html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`}
  </button>`;
}

function Nav() {
  return html`<nav class="nav"><div class="wrap">
    <a class="brand" href="#top">${PROFILE.first[0]}${PROFILE.last[0]}<span>.</span></a>
    <ul>
      <li><a class="link" href="#work">Work</a></li>
      <li class="hide-sm"><a class="link" href="#about">About</a></li>
      <li class="hide-sm"><a class="link" href="#experience">Experience</a></li>
      <li><a class="link" href="#contact">Contact</a></li>
      <li><${ThemeToggle}/></li>
    </ul>
  </div></nav>`;
}

function Hero() {
  const time = useClock(PROFILE.timeZone);
  return html`<header class="hero wrap" id="top">
    <div class="hero-top load">
      <span class="status"><span class="dot"></span>${PROFILE.available}</span>
      <span class="mono">${PROFILE.role}</span>
    </div>
    <h1 class="load d1">${PROFILE.first}<span class="l2">${PROFILE.last}<span class="stop">.</span></span></h1>
    <div class="hero-grid load d2">
      <div>
        <p>${PROFILE.intro.split("React")[0]}<em>React</em>${PROFILE.intro.split("React")[1]}</p>
        <div class="cta-row">
          <a class="btn primary" href="#work">See selected work ↓</a>
          <a class="btn" href="#contact">Start a project</a>
        </div>
      </div>
      <div class="facts">
        <div><span class="mono">Based in</span><b>${PROFILE.city}</b></div>
        <div><span class="mono">Local time</span><b>${time} IST</b></div>
        <div><span class="mono">Experience</span><b>${PROFILE.experienceYears}</b></div>
        <div><span class="mono">Focus</span><b>${PROFILE.focus}</b></div>
      </div>
    </div>
  </header>`;
}

function Ticker() {
  const items = ["Product design","React","HTML5","CSS3","JavaScript","Tailwind CSS","Bootstrap","Media Queries","Responsive Design","Git","GitHub","VS Code","Chrome DevTools"];
  const all = [...items, ...items];
  return html`<div class="ticker" aria-hidden="true"><div class="ticker-track">${all.map((t,i)=>html`<span key=${i}>${t}</span>`)}</div></div>`;
}

function Work({ onOpen }) {
  const filters = ["All", ...Array.from(new Set(PROJECTS.flatMap(p=>p.tags)))];
  const [filter,setFilter] = useState("All");
  const [view,setView] = useState("grid");
  const [hover,setHover] = useState(null);
  const prevRef = useRef(null);
  const list = PROJECTS.filter(p=>filter==="All"||p.tags.includes(filter));

  const move = (e) => { const el=prevRef.current; if(el){ el.style.left=e.clientX+"px"; el.style.top=e.clientY+"px"; } };

  return html`<section class="block wrap" id="work">
    <div class="sec-head">
      <h2>Selected work<sup>(${String(list.length).padStart(2,"0")})</sup></h2>
      <div class="controls">
        <div class="chips" role="group" aria-label="Filter projects">
          ${filters.map(f=>html`<button key=${f} class="chip" aria-pressed=${filter===f} onClick=${()=>setFilter(f)}>${f}</button>`)}
        </div>
        <div class="seg" role="group" aria-label="Layout">
          <button aria-pressed=${view==="grid"} onClick=${()=>setView("grid")}>Grid</button>
          <button aria-pressed=${view==="index"} onClick=${()=>setView("index")}>Index</button>
        </div>
      </div>
    </div>

    ${view==="grid" ? html`<div class="grid">
      ${list.map(p=>html`<button key=${p.id} class="card" onClick=${()=>onOpen(p.id)} aria-label=${"Open case study: "+p.title}>
        <div class="thumb"><${Thumb} t=${p.thumb}/><span class="open">View case study →</span></div>
        <div class="meta">
          <div><h3>${p.title}</h3><p>${p.summary}</p></div>
          <span class="mono">${p.tags.join(" · ")} — ${p.year}</span>
        </div>
      </button>`)}
    </div>` : html`<div onMouseMove=${move}>
      <ul class="index">
        ${list.map(p=>html`<li key=${p.id}>
          <button class="row" onClick=${()=>onOpen(p.id)} onMouseEnter=${()=>setHover(p)} onMouseLeave=${()=>setHover(null)}>
            <span class="mono">${p.year}</span>
            <h3>${p.title}</h3>
            <span class="c">${p.client}</span>
            <span class="mono t">${p.tags.join(" · ")}</span>
            <span class="arrow">→</span>
          </button>
        </li>`)}
      </ul>
      <div ref=${prevRef} class=${"preview"+(hover?" on":"")}>${hover && html`<${Thumb} t=${hover.thumb}/>`}</div>
    </div>`}
  </section>`;
}

function About() {
  return html`<section class="block wrap" id="about">
    <div class="sec-head"><h2>About</h2></div>
    <div class="about">
      <div class="about-copy">
        <p>I started as a front-end developer, moved into design, and never stopped writing code.</p>
        <p>Most of my work sits where product decisions meet implementation: flows with real constraints, design systems that engineers actually adopt, and interfaces that stay fast on a ₹12,000 phone.</p>
        <p>I work best with small teams who want one person to own the experience from first sketch to production.</p>
        <div class="skills">
          ${Object.entries(SKILLS).map(([k,v])=>html`<div key=${k}><span class="mono">${k}</span><ul>${v.map(s=>html`<li key=${s}>${s}</li>`)}</ul></div>`)}
        </div>
      </div>
    </div>
  </section>`;
}

function Experience() {
  return html`<section class="block wrap" id="experience" style=${{paddingTop:0}}>
    <div class="sec-head"><h2>Experience</h2><a class="btn" href="#contact">Request full CV</a></div>
    <ol class="xp">
      ${EXPERIENCE.map(x=>html`<li key=${x.years}>
        <span class="mono">${x.years}</span>
        <div><h3>${x.title}${x.now && html`<span class="now mono">Now</span>`}</h3><div class="co">${x.co}</div></div>
        <p>${x.text}</p>
      </li>`)}
    </ol>
  </section>`;
}

function Quotes() {
  const [i,setI] = useState(0);
  useEffect(()=>{
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const id=setInterval(()=>setI(n=>(n+1)%QUOTES.length),7000); return ()=>clearInterval(id);
  },[]);
  const q = QUOTES[i];
  return html`<section class="wrap" aria-label="Client testimonials">
    <div class="quote">
      <span class="mono" style=${{color:"inherit",opacity:.6}}>Kind words — ${i+1} / ${QUOTES.length}</span>
      <blockquote key=${i} class="load" style=${{marginTop:18}}>${q.q}</blockquote>
      <footer><strong>${q.who}</strong><span>${q.role}</span></footer>
      <div class="qnav">${QUOTES.map((_,n)=>html`<button key=${n} aria-label=${"Show testimonial "+(n+1)} aria-current=${n===i} onClick=${()=>setI(n)}></button>`)}</div>
    </div>
  </section>`;
}

function Contact({ toast }) {
  const copy = (e) => {
    const done = () => toast("Email address copied");
    try {
      navigator.clipboard.writeText(PROFILE.email).then(done).catch(()=>selectEmail());
    } catch(err) { selectEmail(); }
  };
  const selectEmail = () => {
    const el=document.getElementById("email-text"); if(!el) return;
    const r=document.createRange(); r.selectNodeContents(el); const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
    toast("Press Ctrl/Cmd + C to copy");
  };
  return html`<section class="block wrap contact" id="contact">
    <span class="mono">Contact</span>
    <h2 style=${{marginTop:16}}>Have a product<br/>that needs <a href="#contact" onClick=${(e)=>{e.preventDefault();copy();}}>shaping?</a></h2>
    <div class="mail">
      <code id="email-text">${PROFILE.email}</code>
      <button class="btn primary" onClick=${copy}>Copy email</button>
    </div>
    <div class="socials">${PROFILE.socials.map(([n,u])=>html`<a key=${n} href=${u} target="_blank" rel="noopener">${n} ↗</a>`)}</div>
  </section>`;
}

function Sheet({ id, onClose, onOpen }) {
  const idx = PROJECTS.findIndex(p=>p.id===id);
  const p = PROJECTS[idx];
  const next = PROJECTS[(idx+1)%PROJECTS.length];
  const closeRef = useRef(null);
  const bodyRef = useRef(null);
  useEffect(()=>{
    const prev = document.body.style.overflow; document.body.style.overflow="hidden";
    closeRef.current && closeRef.current.focus();
    const k = (e)=>{ if(e.key==="Escape") onClose(); };
    window.addEventListener("keydown",k);
    return ()=>{ document.body.style.overflow=prev; window.removeEventListener("keydown",k); };
  },[]);
  useEffect(()=>{ bodyRef.current && (bodyRef.current.scrollTop=0); },[id]);
  return html`<div>
    <div class="scrim" onClick=${onClose}></div>
    <aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" ref=${bodyRef}>
      <div class="sheet-bar">
        <span class="mono">Case study ${String(idx+1).padStart(2,"0")} / ${String(PROJECTS.length).padStart(2,"0")}</span>
        <button ref=${closeRef} class="icon-btn" onClick=${onClose} aria-label="Close case study">✕</button>
      </div>
      <div class="sheet-body">
        <div class="thumb"><${Thumb} t=${p.thumb}/></div>
        <div>
          <span class="mono">${p.client} · ${p.year}</span>
          <h2 id="sheet-title" style=${{marginTop:1}}>${p.title}</h2>
          <p class="lede">${p.summary}</p>
        </div>
        <div class="kv">
          <div><span class="mono">Role</span><b>${p.role}</b></div>
          <div><span class="mono">Team</span><b>${p.team}</b></div>
          <div><span class="mono">Timeline</span><b>${p.time}</b></div>
        </div>
        <div><h4>The problem</h4><p>${p.problem}</p></div>
        <div><h4>What I did</h4><p>${p.approach}</p></div>
        <div><h4>Results</h4>
          <div class="results">${p.results.map(([n,l])=>html`<div key=${l}><strong>${n}</strong><span>${l}</span></div>`)}</div>
        </div>
        <div><h4>Stack</h4><div class="tags">${p.stack.map(s=>html`<span key=${s}>${s}</span>`)}</div></div>
        <div class="next">
          <span class="mono">Next project</span>
          <button class="btn" onClick=${()=>onOpen(next.id)}>${next.title} →</button>
        </div>
      </div>
    </aside>
  </div>`;
}

function App() {
  const [open,setOpen] = useState(null);
  const [msg,setMsg] = useState(null);
  const tRef = useRef(null);
  const toast = useCallback((m)=>{ setMsg(m); clearTimeout(tRef.current); tRef.current=setTimeout(()=>setMsg(null),2200); },[]);
  return html`<div>
    <${Nav}/>
    <main>
      <${Hero}/>
      <${Ticker}/>
      <${Work} onOpen=${setOpen}/>
      <${About}/>
      <${Experience}/>
      <${Quotes}/>
      <${Contact} toast=${toast}/>
    </main>
    <footer class="site"><div class="wrap">
      <span class="mono">© ${new Date().getFullYear()} ${PROFILE.first} ${PROFILE.last}</span>
      <span class="mono">Designed & built in React</span>
    </div></footer>
    ${open && html`<${Sheet} id=${open} onClose=${()=>setOpen(null)} onOpen=${setOpen}/>`}
    ${msg && html`<div class="toast" role="status">${msg}</div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>

</body></html>
